name: CI/CD

on:
  push:
#    branches:
#      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.17.0'

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test -- --watch=false --code-coverage

      - name: Build Angular App
        run: npm run build --prod

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/cat-finder/browser

  tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4    # ← no "path:"
        with:
          name: angular-dist
      - name: Deploy artifact to API
        uses: codeless-testing/deploy-artifact-action@0.9
        with:
          source_dir: dist/cat-finder/browser
          token: ''

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4    # ← pull build into this runner
        with:
          name: angular-dist
      - name: Sync to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SOURCE_DIR: dist/cat-finder/browser
