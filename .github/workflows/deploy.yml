name: CI/CD

on:
  push:
#    branches:
#      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20.17.0
      - run: npm ci
      - run: npm run build -- --prod   # run Angular production build
      - uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/cat-finder/browser

  tests:
    runs-on: ubuntu-latest
    needs: build            # ensure build job completes first
    steps:
      - uses: actions/checkout@v3     # check out source (if needed for tests)
      - uses: actions/download-artifact@v3
        with:
          name: angular-dist
          path: dist/cat-finder/browser
      - name: Deploy artifact
        uses: codeless-testing/deploy-artifact-action@0.7
        with:
          source_dir: dist/cat-finder/browser
          token: ''

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1'
          SOURCE_DIR: 'dist/cat-finder/browser'
